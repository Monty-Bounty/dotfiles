filetype: json

detect:
    filename: "\\.json$"

rules:
    # Ключи словарей перед двоеточием — бирюзовый (двоеточие забирается в токен)
    - type: "\"[^\"]+\"\\s*:"

    # Строковые значения (желтый)
    - constant.string: "\"[^\"]*\""

    # Числа (фиолетовый)
    - constant.number: "\\b-?[0-9]+(?:\\.[0-9]+)?(?:[eE][+-]?[0-9]+)?\\b"

    # Булевы значения и null (фиолетовый)
    - constant.bool: "\\b(true|false|null)\\b"

    # Структурные скобки и запятые
    - symbol.brackets: "[\\[\\]{}]"
    - symbol.operator: "[,:]"

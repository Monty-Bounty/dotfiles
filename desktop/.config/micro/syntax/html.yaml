filetype: html

detect:
    filename: "\\.(html|htm|shtml|xhtml)$"

rules:
    # 1. Комментарии <!-- ... -->
    - comment:
        start: "<!--"
        end: "-->"
        rules: []

    # 2. DOCTYPE
    - preproc: "<![Dd][Oo][Cc][Tt][Yy][Pp][Ee][^>]*>"

    # 3. HTML-сущности (&amp;, &#x27;) — фиолетовый
    - constant: "&[a-zA-Z0-9#]+;"

    # 4. Атрибуты (зеленый) — знак '=' забирается в токен для обхода ограничений RE2
    - identifier: "\\b[a-zA-Z0-9:_-]+="

    # 5. Значения в кавычках (желтый)
    - constant.string: "\"[^\"]*\"|'[^']*'"

    # 6. Теги: открывающие, закрывающие и одиночные скобки (розовый)
    - statement: "</?[a-zA-Z0-9:_-]+|/?>"

filetype: markdown

detect:
    filename: "\\.(md|mkd|mkdn|mdwn|mdown|markdown)$"

rules:
    # 1. Заголовки: вся строка целиком окрашивается в оранжевый (preproc)
    - preproc: "^#{1,6}\\s+.*$"

    # 2. Горизонтальный разделитель (---, ***) в серый цвет
    - comment: "^(\\*{3,}|-{3,}|_{3,})$"

    # 3. Цитаты и границы блоков кода (```)
    - comment: "^\\s*>.*$"
    - comment: "^```.*$"

    # 4. Жирный текст (**text** и __text__) в розовый (statement)
    - statement: "(\\*\\*|__)[^*_]+(\\*\\*|__)"

    # 5. Инлайн-код (`code`) в розовый
    - statement: "`[^`]+`"

    # 6. HTML-теги и имена атрибутов
    - statement: "</?[a-zA-Z0-9_-]+|/?>"
    - identifier: "\\b[a-zA-Z0-9_-]+="

    # 7. Значения HTML-атрибутов в кавычках
    - constant.string: "\"[^\"]*\"|'[^']*'"

    # 8. Ссылки:
    # Текст ссылки в скобках [] — зеленый (identifier)
    - identifier: "\\[[^\\]]+\\]"
    # URL в круглых скобках — только если внутри протокол или путь (не трогает обычный текст)
    - constant.string.url: "\\((?:https?://|ftp://|[/#.]|mailto:)[^\\)]*\\)"

    # 9. Курсив
    - italic: "(?:^|[^*_])(\\*|_)[^*_]+(\\*|_)"
